<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAM House Bill of Lading</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <header>

        <div class="company">

            <img src="logo.png" class="logo">

            <div>

                <h1>HAM INTERNATIONAL TRANSPORT</h1>

                <p>
                    74 Mnt de St Sulpice<br>
                    Saint-Sulpice, QC J5W 0H2<br>
                    Canada
                </p>

                <p>
                    Documentation@hamintltransport.com<br>
                    +1 (514) 238-4241
                </p>

            </div>

        </div>

        <h2>HOUSE BILL OF LADING</h2>

    </header>

    <section class="numbers">

        <div>
            <label>Booking #</label>
            <input id="booking" type="text">
        </div>

        <div>
            <label>Container #</label>
            <input id="container" type="text">
        </div>

        <div>
            <label>Seal #</label>
            <input id="seal" type="text">
        </div>

        <div>
            <label>Transshipment</label>
            <input id="transshipment" type="text">
        </div>

    </section>

    <section class="three-columns">

        <div class="box">

            <h3>Exporter</h3>

            <textarea id="exporter"></textarea>

        </div>

        <div class="box">

            <h3>Consignee</h3>

            <textarea id="consignee"></textarea>

        </div>

        <div class="box">

            <h3>Notify Party</h3>

            <textarea id="notify"></textarea>

        </div>

    </section>

    <h3>Vehicles</h3>

    <table id="vehicleTable">

        <thead>

        <tr>

            <th>Model & Year</th>

            <th>VIN</th>

            <th>Weight (KG)</th>

            <th>Qty</th>

        </tr>

        </thead>

        <tbody>

        <tr>

            <td><input type="text"></td>

            <td><input type="text"></td>

            <td><input type="text"></td>

            <td><input type="number" value="1"></td>

        </tr>

        </tbody>

    </table>

    <button onclick="addRow()">
        + Add Vehicle
    </button>

    <section class="footer-info">

        <div>

            <label>Freight Term</label>

            <input id="freight" value="PREPAID">

        </div>

        <div>

            <label>HS Code</label>

            <input id="hs">

        </div>

        <div>

            <label>Original No / SWB</label>

            <input id="original">

        </div>

    </section>

    <div class="buttons">

        <button onclick="window.print()">
            Print PDF
        </button>

        <button onclick="clearForm()">
            Clear
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
