<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAM House B/L Generator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>HOUSE BILL OF LADING GENERATOR</h1>


<!-- FORM -->


<div class="form-box">


<h2>Shipment Information</h2>


<div class="grid">


<div>
<label>Booking #</label>
<input id="booking">
</div>


<div>
<label>Container #</label>
<input id="container">
</div>


<div>
<label>Seal #</label>
<input id="seal">
</div>


<div>
<label>Transshipment</label>
<input id="transshipment">
</div>


</div>



<h2>Exporter</h2>

<textarea id="exporter"
placeholder="Company name&#10;Address&#10;Phone&#10;Email"></textarea>



<h2>Consignee</h2>

<textarea id="consignee"
placeholder="Company name&#10;Address&#10;Phone&#10;Email&#10;NIF"></textarea>



<h2>Notify Party</h2>

<textarea id="notify"
placeholder="Company name&#10;Address&#10;Phone&#10;Email&#10;NIF"></textarea>




<h2>Vehicle Information</h2>


<table id="vehicleInput">


<tr>

<th>MODEL & YEAR</th>
<th>VIN</th>
<th>WEIGHT KG</th>
<th>QTY</th>

</tr>


<tr>

<td>
<input class="model">
</td>

<td>
<input class="vin">
</td>

<td>
<input class="weight">
</td>

<td>
<input class="qty" value="1">
</td>


</tr>


</table>


<button onclick="addVehicle()">
+ Add Vehicle
</button>



<br><br>


<label>Freight Term</label>

<input id="freight" value="PREPAID">


<label>HS Code</label>

<input id="hs">


<label>Original No</label>

<input id="original">



<br><br>


<button class="generate"
onclick="generatePDF()">

GENERATE PDF

</button>


</div>



</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="script.js"></script>


</body>

</html>
